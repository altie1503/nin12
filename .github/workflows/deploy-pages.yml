name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          # Consola -> extensiones aceptadas. Para sumar una consola nueva,
          # agregala acá y en SYSTEMS dentro de index.html.
          declare -A SYSTEMS=(
            [n64]="z64 n64 v64"
            [snes]="sfc smc swc fig bs st"
            [nds]="nds"
          )

          # Cada juego queda como {"file": "Juego.nds", "parts": N}.
          # parts > 1 = ROM cortada con divisor.exe en Juego.nds.001, .002, ...
          echo '{}' > games.json
          for system in "${!SYSTEMS[@]}"; do
            dir="roms/$system"
            files='[]'
            if [ -d "$dir" ]; then
              files=$(
                for ext in ${SYSTEMS[$system]}; do
                  find "$dir" -maxdepth 1 -type f -iname "*.$ext" -printf '%f\t1\n'
                  find "$dir" -maxdepth 1 -type f -iname "*.$ext.001" -printf '%f\n' | while IFS= read -r first; do
                    base="${first%.001}"
                    parts=1
                    while [ -f "$dir/$base.$(printf '%03d' $((parts + 1)))" ]; do
                      parts=$((parts + 1))
                    done
                    printf '%s\t%s\n' "$base" "$parts"
                  done
                done | sort -f -u \
                  | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {file: .[0], parts: (.[1] | tonumber)})'
              )
            fi
            jq --arg s "$system" --argjson f "$files" '. + {($s): $f}' games.json > games.tmp
            mv games.tmp games.json
          done

          echo "games.json generado:"
          cat games.json

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html games.json _site/
          cp -r data _site/data
          cp -r roms _site/roms
          rm -f _site/roms/README.md
          find _site/roms -name '.gitkeep' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
